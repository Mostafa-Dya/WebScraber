<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Serio Ludere — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF2; --paper-deep:#F6F0DC; --ink:#000; --ink-soft:#6B645C;
    --rule:#E3D9C2; --accent:#BB3E03; --green:#2F6B3A;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}

  header{padding:52px 5vw 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .masthead{display:flex;flex-direction:column;gap:10px}
  .wordmark{display:block;width:clamp(220px,30vw,340px);height:auto;aspect-ratio:14371/1528;color:var(--ink);fill:currentColor}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .toggle{display:inline-flex;border:1px solid var(--rule);background:var(--paper-deep);position:relative;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .toggle button{background:none;border:0;padding:7px 13px;cursor:pointer;color:var(--ink-soft);font:inherit;letter-spacing:inherit;text-transform:inherit}
  .toggle button.on{background:var(--ink);color:var(--paper)}
  select.cur{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 10px;border:1px solid var(--rule);background:var(--paper-deep);color:var(--ink);cursor:pointer}

  nav{padding:0 5vw;border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 15px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  nav button .n{font-size:9px;opacity:.5;margin-left:5px}

  main{padding:34px 5vw 70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 24px}
  .card{display:flex;flex-direction:column;gap:10px}
  .photo{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.18));position:relative;z-index:1}
  .photo .ph{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);background-color:var(--paper-deep);
    background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.05) 6px 7px),
                     repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.05) 6px 7px);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .photo img.loaded ~ .ph{display:none}
  /* Container is 3:4. A rotated photo needs its pre-rotation box swapped:
     width = container height (133.33%), height = container width (75%). */
  .photo img.rot{position:absolute;top:50%;left:50%;width:133.333%;height:75%;
    transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
  .like{position:absolute;right:8px;bottom:8px;z-index:3;background:rgba(255,253,242,.9);backdrop-filter:blur(4px);border-radius:999px;padding:5px}
  .like button{background:none;border:0;cursor:pointer;display:block;padding:3px;color:var(--ink-soft)}
  .like svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
  .like button[aria-pressed="true"]{color:var(--accent)}
  .like button[aria-pressed="true"] svg{fill:currentColor;stroke:currentColor}

  .nm{font-size:14px;font-weight:500;line-height:1.3}
  .meta{list-style:none;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--ink-soft)}
  .price{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--green);margin-top:5px;letter-spacing:.02em}

  .state{padding:60px 5vw;font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
  footer{border-top:1px solid var(--rule);padding:26px 5vw 44px;display:flex;gap:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
  footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<header>

6C797.131 217.977 330.752 112.514 237.992 352.361C142.079 600.121 551.11 625.588 703.654 663.572C918.564 717.095 1136.2 802.272 1156.56 1056.79C1198.99 1587.71 471.827 1579.51 128.028 1448.43C91.0393 1434.33 24.3728 1416.35 17.4911 1372.47C13.4768 1346.71 13.7636 1210.17 22.3657 1191.61C25.2331 1185.42 29.3908 1177.94 36.1291 1176.07C47.5986 1172.76 163.441 1239.95 189.104 1250.74C364.444 1324.55 666.808 1360.81 835.984 1260.24C977.632 1176.07 968.743 1004.13 824.371 930.181C572.902 801.265 41.7205 866.011 2.72416 468.328C-46.7381 -36.2576 586.522 -56.6885 926.736 59.5661C952.829 68.4866 1044.59 103.162 1059.35 120.571C1076.56 140.858 1074.41 326.894 1062.51 335.095V334.951Z" fill="#000000"/><path d="M7674.39 35.6821C7692.74 30.3586 7807.87 31.078 7830.09 34.675C7850.02 37.8403 7863.78 47.9119 7868.37 68.055C7884.57 345.455 7852.02 638.393 7869.66 913.922C7882.99 1123.41 7968.44 1322.4 8202.85 1341.1C8540.77 1367.86 8648.29 1179.09 8665.21 870.471C8679.69 604.869 8653.31 327.614 8666.79 60.861C8668.65 54.5303 8677.25 44.3149 8682.7 41.0057C8698.33 31.6535 8825.07 30.2147 8847.72 34.3872C8860.91 36.8331 8869.08 45.6098 8876.39 55.9691L8880.55 935.648C8858.9 1317.94 8654.89 1527.14 8267.5 1528.14C7429.37 1530.59 7692.17 621.991 7647.43 73.3785C7646.72 58.5589 7660.62 39.7107 7674.39 35.826V35.6821Z" fill="#000000"/><path d="M6816.76 1290.46H7565.57C7570.3 1290.46 7588.65 1313.48 7590.52 1322.97C7594.67 1344.84 7593.24 1458.36 7583.92 1474.05C7579.05 1482.1 7567.86 1489.73 7558.26 1491.31L6622.92 1488.29C6598.26 1480.09 6596.4 1453.61 6594.39 1430.74L6595.39 81.4358C6599.27 54.6742 6605.86 39.1352 6634.53 34.5311C6659.05 30.6463 6761.27 29.7831 6784.35 34.2433C6793.67 35.9699 6816.76 54.5303 6816.76 59.2783V1290.46Z" fill="#000000"/><path d="M4034.54 35.6821C4052.03 30.6463 4176.91 31.2218 4196.26 35.6821C4215.76 40.1424 4227.09 54.3864 4229.52 74.0979L4230.24 1438.08C4230.96 1466.85 4219.34 1486.56 4190.1 1491.17C4165.15 1495.05 4063.93 1495.91 4040.28 1491.45C4025.08 1488.58 4010.89 1474.48 4008.02 1459.08L4007.44 73.2347C4006.73 58.4151 4020.63 39.5669 4034.4 35.6821H4034.54Z" fill="#000000"/></g></svg>
    <p class="eyebrow">Catalogue</p>
  </div>
  <div class="controls">
    <div class="toggle" id="unitTog">
      <button data-u="cm" class="on" onclick="setUnit('cm')">cm</button>
      <button data-u="ft" onclick="setUnit('ft')">ft</button>
    </div>
    <select class="cur" id="cur" onchange="setCur(this.value)">
      <option>USD</option><option>MXN</option><option>CAD</option>
      <option>EUR</option><option>AED</option><option>SAR</option>
    </select>
  </div>
</header>

<nav id="nav"></nav>
<main><div id="state" class="state">Loading the collection…</div><div id="grid" class="grid"></div></main>

<footer>
  <a href="https://www.serioludere.com" target="_blank" rel="noopener">serioludere.com</a>
  <a href="https://www.instagram.com/serioluderestudio" target="_blank" rel="noopener">@serioluderestudio</a>
  <a href="https://wa.me/16475615157" target="_blank" rel="noopener">+1 647 561 5157</a>
  <a href="mailto:hello@serioludere.com">hello@serioludere.com</a>
  <span>&copy; <span id="yr"></span> Serio Ludere</span>
</footer>

<script>
const API    = "https://script.google.com/macros/s/AKfycbyaUAWWivAE3NnS41mjdbErhFHvaJhpwXY1cdn5nhZU-y1T1IcdM1EzU1R3RjLQmcpMSw/exec";
const SECRET = "SL-view-9f3c81";   // public key: published rugs + saving only
const CLIENT = new URLSearchParams(location.search).get("c") || "anon";

/* All prices stored USD. Edit these when rates move. */
const RATES  = { USD:1, MXN:17.5, CAD:1.37, EUR:0.92, AED:3.67, SAR:3.75 };
const SYM    = { USD:"$", MXN:"$", CAD:"$", EUR:"\u20AC", AED:"AED ", SAR:"SAR " };
const ORDER  = ["Classics","Gabbeh","Modern","Kilims","Tulu","Wabi Sabi","Signed","More"];

let RUGS = [], unit = "cm", cur = "USD", activeTab = null;
let saved = {};
try { saved = JSON.parse(localStorage.getItem("sl-saved") || "{}"); } catch(e){ saved = {}; }

/* JSONP read — no CORS setup needed */
function call(params){
  return new Promise((resolve,reject)=>{
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const t = setTimeout(()=>{ done(); reject(new Error("timed out")); }, 45000);
    function done(){ clearTimeout(t); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = d => { done(); resolve(d); };
    const q = Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    const s = document.createElement("script");
    s.src = API + "?" + q + "&callback=" + cb;
    s.onerror = ()=>{ done(); reject(new Error("could not reach the catalogue")); };
    document.body.appendChild(s);
  });
}

function ftIn(cm){
  const total = cm / 2.54;
  let f = Math.floor(total / 12), i = Math.round(total - f*12);
  if(i === 12){ f++; i = 0; }
  return f + "'" + (i ? " " + i + '"' : "");
}
function money(usd){
  if(!usd) return "";
  const v = usd * RATES[cur];
  return SYM[cur] + Math.round(v).toLocaleString();
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function boot(){
  document.getElementById("yr").textContent = new Date().getFullYear();
  try{
    const r = await call({action:"list_catalogue", secret:SECRET});
    if(!r.ok) throw new Error(r.error || "could not load");
    RUGS = r.rugs || [];
    if(!RUGS.length){
      document.getElementById("state").textContent = "No rugs published yet.";
      return;
    }
    document.getElementById("state").style.display = "none";
    buildNav(); render();
  }catch(e){
    document.getElementById("state").textContent = e.message;
  }
}

function buildNav(){
  const present = [...new Set(RUGS.map(r=>r.collection))];
  const tabs = ORDER.filter(t=>present.includes(t))
                    .concat(present.filter(t=>!ORDER.includes(t)).sort());
  activeTab = activeTab && tabs.includes(activeTab) ? activeTab : tabs[0];
  document.getElementById("nav").innerHTML = tabs.map(t=>{
    const n = RUGS.filter(r=>r.collection===t).length;
    return '<button class="'+(t===activeTab?"on":"")+'" onclick="go(\''+esc(t).replace(/'/g,"\\'")+'\')">'+
           esc(t)+'<span class="n">'+n+'</span></button>';
  }).join("");
}
function go(t){ activeTab = t; buildNav(); render(); }
function setUnit(u){ unit = u; document.querySelectorAll("#unitTog button").forEach(b=>b.classList.toggle("on", b.dataset.u===u)); render(); }
function setCur(c){ cur = c; render(); }

function render(){
  const list = RUGS.filter(r=>r.collection===activeTab);
  document.getElementById("grid").innerHTML = list.map(r=>{
    let dims = "";
    if(r.width && r.length){
      dims = unit === "cm" ? (r.width + " \u00D7 " + r.length + " cm")
                           : (ftIn(r.width) + " \u00D7 " + ftIn(r.length));
    }
    const meta = [dims, r.material, r.age, r.origin].filter(Boolean)
                   .map(x=>"<li>"+esc(x)+"</li>").join("");
    const price = r.price ? '<div class="price">'+money(r.price)+'</div>' : "";
    const photo = (r.photos && r.photos.length)
      ? '<img src="'+r.photos[0]+'" alt="'+esc(r.name)+'" loading="lazy" data-rot="'+(r.rotate==="force"?"force":(r.rotate?1:0))+
        '" onload="onPhoto(this)" onerror="this.remove()">'
      : "";
    const on = saved[r.id] ? "true" : "false";
    return '<div class="card"><div class="photo">'+photo+
      '<div class="ph">photo to come</div>'+
      '<div class="like"><button type="button" aria-pressed="'+on+'" aria-label="Save '+esc(r.name)+
      '" onclick="like(this,\''+esc(r.id).replace(/'/g,"\\'")+'\')">'+
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.4 1.1 4.2 2.3C11.8 6.1 13.2 5 15.2 5c3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>'+
      '</button></div></div>'+
      '<div class="nm">'+esc(r.name)+'</div>'+
      (meta ? '<ul class="meta">'+meta+'</ul>' : "")+ price + '</div>';
  }).join("");
}

/* Karavan (and others) shoot portrait rugs on their side. If the sheet says
   the rug is taller than it is wide but the photo is wider than tall, turn it
   90 degrees clockwise. Tag a rug "rotate" or "no-rotate" to force either way. */
function onPhoto(img){
  img.classList.add("loaded");
  /* The sheet decides whether this rug SHOULD be turned; we only act on it
     if the photo really did come through landscape. */
  const r = img.dataset.rot;
  /* "force" = tagged rotate in the sheet, turn regardless of the file's shape.
     "1" = the sheet says portrait, so only turn a landscape file. */
  if(r === "force" || (r === "1" && img.naturalWidth > img.naturalHeight)){
    img.classList.add("rot");
  }
}

function like(btn, id){
  const now = btn.getAttribute("aria-pressed") !== "true";
  btn.setAttribute("aria-pressed", now ? "true" : "false");
  saved[id] = now;
  try { localStorage.setItem("sl-saved", JSON.stringify(saved)); } catch(e){}
  fetch(API, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ secret:SECRET, action:"save", client:CLIENT, rug:id, state:now }) }).catch(()=>{});
}

boot();
</script>
</body>
</html>
